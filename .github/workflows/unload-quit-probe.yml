name: Unload quit probe
on:
  push:
    branches: [t3/windows-unload-quit-probe]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: probe ${{ matrix.build }} x64
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build: [nightly3, main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts/windows
      - name: Download the nightly.3 installer
        if: matrix.build == 'nightly3'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.2.47-nightly.3 -R "${{ github.repository }}" -p "Ardia-0.2.47-nightly.3-windows-x64-setup.exe" -D "${{ runner.temp }}/setup"
      - name: Download main's installer from run 44123681455
        if: matrix.build == 'main'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Ardia-Setup-x64
          path: ${{ runner.temp }}/setup
          run-id: 44123681455
          github-token: ${{ github.token }}
      - name: Run the unload quit probe
        shell: pwsh
        run: |
          $setup = Get-ChildItem -LiteralPath "${{ runner.temp }}/setup" -Recurse -File -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw "no installer downloaded" }
          Write-Host "installer: $($setup.FullName) $($setup.Length)"
          scripts/windows/unload-quit-probe.ps1 -Setup $setup.FullName -Out "${{ runner.temp }}/unload-probe" -Label "${{ matrix.build }}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unload-probe-${{ matrix.build }}
          path: ${{ runner.temp }}/unload-probe
